<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Produk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f1f5f9; 
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .topbar { 
            background: rgba(30, 41, 59, 0.8); 
            backdrop-filter: blur(10px);
            padding: 16px 32px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { width: 40px; height: 40px; border-radius: 8px; }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover { background: #059669; }
        .btn-ghost { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .hero { text-align: center; padding: 60px 20px; }
        .hero h2 { font-size: 32px; margin-bottom: 10px; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .search-box { 
            max-width: 600px; 
            margin: 30px auto; 
            display: flex; 
            gap: 10px;
            background: rgba(30, 41, 59, 0.8);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .search-box input { 
            flex: 1; 
            background: none; 
            border: none; 
            color: white; 
            font-size: 16px;
            outline: none;
        }
        .stats { display: flex; gap: 20px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
        .stat-card { 
            background: rgba(30, 41, 59, 0.6); 
            padding: 20px 30px; 
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #10b981; }
        .stat-label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { 
            background: rgba(30, 41, 59, 0.6); 
            border-radius: 12px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .card:hover { transform: translateY(-4px); }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #1e293b; }
        .card-body { padding: 16px; }
        .card-title { font-weight: 600; margin-bottom: 8px; }
        .card-meta { font-size: 13px; color: #94a3b8; font-family: monospace; }
        .hidden { display: none !important; }
        .modal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.7); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            z-index: 1000;
        }
        .modal-content { 
            background: #1e293b; 
            padding: 32px; 
            border-radius: 16px; 
            max-width: 400px; 
            width: 90%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            background: #0f172a; 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }
        .form-group input:focus { border-color: #10b981; }
        #reader { width: 100%; max-width: 500px; margin: 20px auto; }
        @media (max-width: 768px) {
            .topbar { padding: 16px 20px; flex-direction: column; gap: 16px; }
            .hero h2 { font-size: 24px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- USER VIEW -->
<div id="userView" class="hidden">
    <div class="topbar">
        <div class="brand">
            <img src="https://share.google/sEmzJzksJuTmp26au" alt="Logo" onerror="this.style.display='none'">
            <h1>Database Produk</h1>
        </div>
        <button class="btn btn-ghost" onclick="showLogin()">🔐 Login Admin</button>
    </div>
    
    <div class="hero">
        <h2>Pencarian Produk</h2>
        <p>Ketik nama produk atau scan barcode untuk melihat detail</p>
        
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Cari nama produk atau barcode..." oninput="searchProducts()">
            <button class="btn btn-primary" onclick="startScan()">📷 Scan</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalProducts">0</div>
                <div class="stat-label">Total Produk</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalPhotos">0</div>
                <div class="stat-label">Ada Foto</div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Daftar Produk</h3>
            <span style="background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px; font-size: 13px;" id="productCount">0 produk</span>
        </div>
        <div class="grid" id="productGrid"></div>
    </div>
</div>

<!-- ADMIN VIEW -->
<div id="adminView" class="hidden">
    <div class="topbar">
        <div class="brand">
            <img src="https://share.google/sEmzJzksJuTmp26au" alt="Logo" onerror="this.style.display='none'">
            <div>
                <h1>Database Produk</h1>
                <p style="font-size: 12px; color: #94a3b8;">Admin Panel</p>
            </div>
        </div>
        <button class="btn btn-ghost" onclick="logout()">🚪 Logout</button>
    </div>
    
    <div class="container" style="margin-top: 40px;">
        <div style="display: flex; gap: 20px; margin-bottom: 40px;">
            <button class="btn btn-primary" onclick="showSection('dashboard')">📊 Dashboard</button>
            <button class="btn btn-ghost" onclick="showSection('input')">➕ Input Produk</button>
            <button class="btn btn-ghost" onclick="showSection('manage')">📋 Kelola Produk</button>
        </div>
        
        <div id="section-dashboard">
            <h2 style="margin-bottom: 24px;">Dashboard</h2>
            <div class="stats" style="justify-content: flex-start; margin-bottom: 30px;">
                <div class="stat-card">
                    <div class="stat-value" id="dashTotal">0</div>
                    <div class="stat-label">Total Produk</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="dashToday">0</div>
                    <div class="stat-label">Hari Ini</div>
                </div>
            </div>
        </div>
        
        <div id="section-input" class="hidden">
            <h2 style="margin-bottom: 24px;">Input Produk Baru</h2>
            <div class="modal-content" style="max-width: 600px;">
                <form onsubmit="saveProduct(event)">
                    <div class="form-group">
                        <label>Foto Produk</label>
                        <input type="file" id="productImage" accept="image/*" capture="environment" onchange="previewImage(this)">
                        <img id="imagePreview" style="max-width: 200px; margin-top: 10px; border-radius: 8px; display: none;">
                    </div>
                    <div class="form-group">
                        <label>Barcode *</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="barcode" required placeholder="Scan atau ketik barcode">
                            <button type="button" class="btn btn-primary" onclick="startScan()">📷</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Nama Produk *</label>
                        <input type="text" id="productName" required placeholder="Contoh: Tissue Paseo 250s">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">💾 Simpan</button>
                </form>
            </div>
        </div>
        
        <div id="section-manage" class="hidden">
            <h2 style="margin-bottom: 24px;">Kelola Produk</h2>
            <div class="modal-content" style="max-width: 100%;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid rgba(255,255,255,0.1);">
                            <th style="padding: 12px; text-align: left;">Foto</th>
                            <th style="padding: 12px; text-align: left;">Nama</th>
                            <th style="padding: 12px; text-align: left;">Barcode</th>
                            <th style="padding: 12px; text-align: left;">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <h2 style="margin-bottom: 24px; text-align: center;">Login Admin</h2>
        <form onsubmit="login(event)">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">🚀 Login</button>
        </form>
        <button class="btn btn-ghost" style="width: 100%; margin-top: 12px;" onclick="closeLogin()">← Kembali</button>
    </div>
</div>

<!-- SCAN MODAL -->
<div id="scanModal" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin-bottom: 16px;">Scan Barcode</h3>
        <div id="reader"></div>
        <div id="scanResult" style="text-align: center; margin-top: 16px; padding: 16px; background: rgba(16, 185, 129, 0.1); border-radius: 8px; display: none;">
            <div style="color: #10b981; font-size: 20px; font-weight: 700;" id="scanValue"></div>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-primary" onclick="initScan()" style="flex: 1;">📷 Mulai Scan</button>
            <button class="btn btn-ghost" onclick="closeScan()" style="flex: 1;">✖ Tutup</button>
        </div>
        <button id="useScanBtn" class="btn btn-primary" onclick="useScanResult()" style="width: 100%; margin-top: 12px; display: none;">✓ Gunakan</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDB8ljheAGKQIFqslO6RohvfWnu6jF6iIQ",
        authDomain: "database-produk-40db0.firebaseapp.com",
        projectId: "database-produk-40db0",
        storageBucket: "database-produk-40db0.firebasestorage.app",
        messagingSenderId: "801084244428",
        appId: "1:801084244428:web:f1a6d2e4f53101f5da1d69"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    let products = [];
    let scannedCode = "";
    let html5QrCode = null;

    // Auth State
    onAuthStateChanged(auth, (user) => {
        document.getElementById('loginModal').classList.add('hidden');
        if (user) {
            document.getElementById('userView').classList.add('hidden');
            document.getElementById('adminView').classList.remove('hidden');
            loadProducts();
        } else {
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('userView').classList.remove('hidden');
            loadProducts();
        }
    });

    // Load Products
    async function loadProducts() {
        try {
            const q = query(collection(db, "produk"), orderBy("tanggal", "desc"));
            const snapshot = await getDocs(q);
            products = [];
            snapshot.forEach((doc) => {
                products.push({ id: doc.id, ...doc.data() });
            });
            renderProducts();
            updateStats();
        } catch (error) {
            console.error("Error loading products:", error);
            alert("Gagal memuat database: " + error.message);
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productGrid');
        const table = document.getElementById('productTable');
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        
        const filtered = products.filter(p => 
            p.nama?.toLowerCase().includes(searchTerm) || 
            p.barcode?.includes(searchTerm)
        );

        // Render Grid (User)
        grid.innerHTML = filtered.map(p => `
            <div class="card" onclick="viewProduct('${p.id}')">
                <img src="${p.foto || 'https://via.placeholder.com/250x200?text=No+Image'}" alt="${p.nama}">
                <div class="card-body">
                    <div class="card-title">${p.nama}</div>
                    <div class="card-meta">${p.barcode}</div>
                </div>
            </div>
        `).join('') || '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">Belum ada produk</p>';

        // Render Table (Admin)
        table.innerHTML = filtered.map(p => `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.05);">
                <td style="padding: 12px;"><img src="${p.foto || 'https://via.placeholder.com/48?text=No'}" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover;"></td>
                <td style="padding: 12px; font-weight: 600;">${p.nama}</td>
                <td style="padding: 12px; font-family: monospace;">${p.barcode}</td>
                <td style="padding: 12px;">
                    <button class="btn btn-ghost" onclick="editProduct('${p.id}')" style="padding: 6px 12px;">✏️</button>
                    <button class="btn btn-ghost" onclick="deleteProduct('${p.id}')" style="padding: 6px 12px; color: #ef4444;">🗑️</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="4" style="padding: 20px; text-align: center; color: #94a3b8;">Belum ada produk</td></tr>';
        
        document.getElementById('productCount').textContent = filtered.length + ' produk';
    }

    function updateStats() {
        document.getElementById('totalProducts').textContent = products.length;
        document.getElementById('totalPhotos').textContent = products.filter(p => p.foto).length;
        document.getElementById('dashTotal').textContent = products.length;
        
        const today = new Date().toDateString();
        const todayCount = products.filter(p => {
            const date = p.tanggal?.toDate ? p.tanggal.toDate() : new Date(p.tanggal);
            return date.toDateString() === today;
        }).length;
        document.getElementById('dashToday').textContent = todayCount;
    }

    window.searchProducts = function() {
        renderProducts();
    };

    window.saveProduct = async function(e) {
        e.preventDefault();
        const barcode = document.getElementById('barcode').value;
        const nama = document.getElementById('productName').value;
        const fileInput = document.getElementById('productImage');
        
        let foto = null;
        if (fileInput.files[0]) {
            foto = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            });
        }

        try {
            await addDoc(collection(db, "produk"), {
                barcode,
                nama,
                foto,
                tanggal: new Date()
            });
            alert('Produk berhasil disimpan!');
            e.target.reset();
            document.getElementById('imagePreview').style.display = 'none';
            loadProducts();
        } catch (error) {
            alert('Gagal menyimpan: ' + error.message);
        }
    };

    window.deleteProduct = async function(id) {
        if (confirm('Hapus produk ini?')) {
            try {
                await deleteDoc(doc(db, "produk", id));
                loadProducts();
            } catch (error) {
                alert('Gagal menghapus: ' + error.message);
            }
        }
    };

    window.showLogin = function() {
        document.getElementById('loginModal').classList.remove('hidden');
    };

    window.closeLogin = function() {
        document.getElementById('loginModal').classList.add('hidden');
    };

    window.login = async function(e) {
        e.preventDefault();
        try {
            await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
        } catch (error) {
            alert('Login gagal: ' + error.message);
        }
    };

    window.logout = async function() {
        await signOut(auth);
    };

    window.showSection = function(section) {
        ['dashboard', 'input', 'manage'].forEach(s => {
            document.getElementById('section-' + s).classList.add('hidden');
        });
        document.getElementById('section-' + section).classList.remove('hidden');
    };

    window.previewImage = function(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    };

    window.startScan = function() {
        document.getElementById('scanModal').classList.remove('hidden');
        document.getElementById('scanResult').style.display = 'none';
        document.getElementById('useScanBtn').style.display = 'none';
    };

    window.closeScan = function() {
        if (html5QrCode) {
            html5QrCode.stop().catch(err => console.log(err));
        }
        document.getElementById('scanModal').classList.add('hidden');
    };

    window.initScan = async function() {
        try {
            if (html5QrCode) {
                await html5QrCode.stop();
            }
            
            html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    scannedCode = decodedText;
                    document.getElementById('scanValue').textContent = decodedText;
                    document.getElementById('scanResult').style.display = 'block';
                    document.getElementById('useScanBtn').style.display = 'block';
                    html5QrCode.stop();
                },
                (error) => { /* Ignore scan errors */ }
            );
        } catch (err) {
            alert('Gagal mengakses kamera: ' + err);
        }
    };

    window.useScanResult = function() {
        const barcodeInput = document.getElementById('barcode');
        const searchInput = document.getElementById('searchInput');
        
        if (barcodeInput && !barcodeInput.closest('.hidden')) {
            barcodeInput.value = scannedCode;
        } else if (searchInput) {
            searchInput.value = scannedCode;
            searchProducts();
        }
        
        closeScan();
    };

    window.viewProduct = function(id) {
        const product = products.find(p => p.id === id);
        if (product) {
            alert(`Produk: ${product.nama}\nBarcode: ${product.barcode}`);
        }
    };

    window.editProduct = function(id) {
        const product = products.find(p => p.id === id);
        if (product) {
            const newName = prompt('Edit nama produk:', product.nama);
            if (newName && newName.trim()) {
                updateDoc(doc(db, "produk", id), { nama: newName.trim() })
                    .then(() => {
                        alert('Produk diperbarui');
                        loadProducts();
                    })
                    .catch(err => alert('Gagal update: ' + err.message));
            }
        }
    };

    // Expose functions to window
    window.loadProducts = loadProducts;
    window.renderProducts = renderProducts;
    
    // Initial load
    loadProducts();
</script>

</body>
</html>
