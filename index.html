<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Produk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-2: #94a3b8;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --radius: 12px;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.08), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.08), transparent 40%);
            pointer-events: none; z-index: 0;
        }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; font-size: 14px; color: var(--text); background: transparent; border: none; outline: none; width: 100%; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 10px; }
        
        .icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .icon-sm { width: 16px; height: 16px; }

        /* Loading */
        .loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 16px; }
        .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Layout */
        .app { position: relative; z-index: 1; min-height: 100vh; display: none; }
        .app.active { display: flex; }
        .user-app { display: none; position: relative; z-index: 1; min-height: 100vh; }
        .user-app.active { display: block; }

        /* Topbar */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
        .brand h1 { font-size: 18px; font-weight: 700; }
        .btn-login {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 16px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-2);
            transition: all 0.2s;
        }
        .btn-login:hover { background: var(--surface-2); color: var(--text); }

        /* Hero & Search */
        .hero { padding: 48px 32px 32px; text-align: center; max-width: 800px; margin: 0 auto; }
        .hero h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-2); font-size: 14px; margin-bottom: 24px; }
        .search-box {
            display: flex; align-items: center; gap: 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 12px 16px;
            box-shadow: var(--shadow); transition: all 0.2s;
        }
        .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
        .search-box input { font-size: 15px; }
        .btn-scan {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--accent); color: white;
            display: grid; place-items: center; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .btn-scan:hover { transform: scale(1.05); background: var(--accent-hover); }

        /* Stats */
        .stats { display: flex; gap: 16px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
        .stat-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 10px;
        }
        .stat-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(16, 185, 129, 0.15); color: var(--accent); display: grid; place-items: center; }
        .stat-val { font-size: 18px; font-weight: 700; line-height: 1; }
        .stat-label { font-size: 11px; color: var(--text-2); }

        /* Content */
        .content { max-width: 1200px; margin: 0 auto; padding: 32px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h3 { font-size: 16px; font-weight: 600; }
        .badge { font-size: 12px; padding: 4px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; color: var(--text-2); }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
            transition: all 0.25s; cursor: pointer;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
        .card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface-2); }
        .card-body { padding: 14px; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 12px; color: var(--text-2); font-family: monospace; }

        /* Admin Layout */
        .sidebar {
            width: 240px; background: var(--surface); border-right: 1px solid var(--border);
            padding: 24px 16px; position: fixed; top: 0; left: 0; bottom: 0;
            display: flex; flex-direction: column; z-index: 50;
        }
        .nav { display: flex; flex-direction: column; gap: 4px; margin-top: 24px; flex: 1; }
        .nav-btn {
            display: flex; align-items: center; gap: 12px; padding: 10px 14px;
            border-radius: 8px; color: var(--text-2); font-size: 14px; font-weight: 500;
            transition: all 0.2s; text-align: left;
        }
        .nav-btn:hover { background: var(--surface-2); color: var(--text); }
        .nav-btn.active { background: rgba(16, 185, 129, 0.1); color: var(--accent); }
        .nav-btn.active .nav-icon { background: rgba(16, 185, 129, 0.2); color: var(--accent); }
        .nav-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
        
        .main { flex: 1; margin-left: 240px; padding: 32px; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .page-subtitle { font-size: 14px; color: var(--text-2); margin-bottom: 32px; }

        /* Forms */
        .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; max-width: 600px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-wrap {
            display: flex; align-items: center; gap: 10px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 14px; transition: all 0.2s;
        }
        .input-wrap:focus-within { border-color: var(--accent); }
        .file-drop {
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 32px; text-align: center; cursor: pointer;
            transition: all 0.2s; background: var(--bg);
        }
        .file-drop:hover { border-color: var(--accent); background: rgba(16, 185, 129, 0.05); }
        .file-drop.has-file { border-color: var(--accent); border-style: solid; }
        .file-drop img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 12px; display: none; }
        .file-drop.has-file img { display: block; margin: 12px auto 0; }
        .file-drop.has-file .upload-icon { display: none; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
            transition: all 0.2s; border: 1px solid transparent;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; }

        /* Table */
        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 14px 16px; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; background: var(--surface-2); border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: rgba(255, 255, 255, 0.02); }
        .tbl-img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: var(--surface-2); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px); display: none; align-items: center;
            justify-content: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
        .modal {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; width: 100%; max-width: 480px;
            max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s;
        }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .modal-body { padding: 24px; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }
        .close-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; transition: 0.2s; }
        .close-btn:hover { background: var(--danger); color: white; }

        /* Scanner */
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
        .scan-status { margin-top: 16px; padding: 12px; background: var(--bg); border-radius: 8px; text-align: center; font-size: 13px; color: var(--text-2); }
        .scan-status.success { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
        .scan-result { margin-top: 16px; padding: 16px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent); border-radius: 8px; text-align: center; }
        .scan-val { font-size: 20px; font-weight: 700; color: var(--accent); font-family: monospace; margin-top: 8px; }

        /* Login Modal Specific */
        .login-box { max-width: 400px; text-align: center; padding: 40px 32px; }
        .login-box h2 { margin-bottom: 8px; }
        .login-box p { color: var(--text-2); font-size: 14px; margin-bottom: 24px; }

        .toast {
            position: fixed; top: 20px; right: 20px; padding: 14px 20px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 10px; box-shadow: var(--shadow); z-index: 200;
            display: flex; align-items: center; gap: 10px; animation: slideIn 0.3s;
        }
        .toast.success { border-left: 3px solid var(--accent); }
        .toast.error { border-left: 3px solid var(--danger); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }
        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 20px; }
            .topbar { padding: 16px 20px; }
            .hero { padding: 32px 20px; }
            .content { padding: 20px; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }
    </style>
</head>
<body>
