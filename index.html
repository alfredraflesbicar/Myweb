<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPL Retur - Cloud Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: slideUp 0.5s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 100%;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
        }

        .btn-icon {
            padding: 10px;
            border-radius: 10px;
        }

        /* Navigation */
        .nav-bar {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-brand h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
        }

        .nav-item {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Search Box */
        .search-container {
            position: relative;
            margin-bottom: 24px;
        }

        .search-box {
            width: 100%;
            padding: 16px 20px 16px 50px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--bg-glass);
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-barcode {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .input-with-button {
            display: flex;
            gap: 12px;
        }

        .input-with-button .form-input {
            flex: 1;
        }

        /* File Upload */
        .file-upload {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-glass);
        }

        .file-upload:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .file-upload.has-file {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }

        .file-upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .file-upload-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .file-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 16px;
            border-radius: 12px;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: var(--bg-glass);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: var(--bg-glass);
        }

        .table-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--bg-glass);
            color: var(--text-primary);
        }

        /* Scanner */
        .scanner-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
        }

        .scan-result {
            margin-top: 20px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 12px;
            text-align: center;
        }

        .scan-result-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--success);
            font-family: 'Courier New', monospace;
            margin-top: 8px;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 2000;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-bar {
                flex-direction: column;
                gap: 16px;
            }

            .nav-menu {
                width: 100%;
                justify-content: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .login-card {
                padding: 32px 24px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-header">
                <h1>SPL Retur</h1>
                <p>Cloud Database Management</p>
            </div>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" class="input-field" id="username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="input-field" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="showUserMode()" style="width: 100%;">
                    Masuk sebagai User
                </button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <div class="container">
            <!-- Navigation -->
            <div class="nav-bar">
                <div class="nav-brand">
                    <h2>SPL Retur</h2>
                </div>
                <div class="nav-menu">
                    <button class="nav-item active" onclick="showSection('dashboard')">Dashboard</button>
                    <button class="nav-item" onclick="showSection('input')">Input Produk</button>
                    <button class="nav-item" onclick="showSection('manage')">Kelola Produk</button>
                </div>
                <div class="nav-user">
                    <span class="user-badge" id="userBadge">User</span>
                    <button class="btn btn-secondary btn-icon" onclick="logout()" id="logoutBtn" style="display: none;">
                        Logout
                    </button>
                </div>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboardSection" class="section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalProducts">0</div>
                        <div class="stat-label">Total Produk</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="todayProducts">0</div>
                        <div class="stat-label">Hari Ini</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Cari Produk</h3>
                    </div>
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-box" id="searchBox" placeholder="Cari berdasarkan nama atau barcode..." oninput="searchProducts()">
                    </div>
                    <div class="product-grid" id="productGrid"></div>
                </div>
            </div>

            <!-- Input Section -->
            <div id="inputSection" class="section hidden">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Input Produk Baru</h3>
                    </div>
                    <form id="productForm">
                        <div class="form-group">
                            <label class="form-label">Foto Produk</label>
                            <div class="file-upload" id="fileUpload" onclick="document.getElementById('productImage').click()">
                                <div class="file-upload-icon"></div>
                                <div class="file-upload-text" id="fileUploadText">Klik untuk upload foto</div>
                                <input type="file" id="productImage" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelect(event)">
                                <img id="imagePreview" class="file-preview hidden">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Barcode</label>
                            <div class="input-with-button">
                                <input type="text" class="form-input" id="barcode" placeholder="Scan atau ketik barcode" required>
                                <button type="button" class="btn btn-secondary" onclick="openScanner()">
                                     Scan
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Nama Produk</label>
                            <input type="text" class="form-input" id="productName" placeholder="Masukkan nama produk" required>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            Simpan Produk
                        </button>
                    </form>
                </div>
            </div>

            <!-- Manage Section -->
            <div id="manageSection" class="section hidden">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Kelola Produk</h3>
                    </div>
                    <div class="search-container">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-box" id="manageSearch" placeholder="Cari produk..." oninput="renderManageTable()">
                    </div>
                    <div class="table-container">
                        <table id="productTable">
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nama</th>
                                    <th>Barcode</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div id="scannerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Scan Barcode</h3>
                <button class="modal-close" onclick="closeScanner()"></button>
            </div>
            <div class="scanner-container">
                <div id="reader"></div>
                <div id="scanResult" class="scan-result hidden">
                    <div>Barcode Terdeteksi:</div>
                    <div class="scan-result-value" id="scanResultValue"></div>
                </div>
            </div>
            <div style="margin-top: 20px; display: flex; gap: 12px;">
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeScanner()">Batal</button>
                <button class="btn btn-success" style="flex: 1;" id="useScanBtn" onclick="useScanResult()" disabled>Gunakan</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit Produk</h3>
                <button class="modal-close" onclick="closeEditModal()">✕</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label class="form-label">Foto Produk</label>
                    <div class="file-upload" id="editFileUpload" onclick="document.getElementById('editImage').click()">
                        <div class="file-upload-icon">📷</div>
                        <div class="file-upload-text" id="editFileUploadText">Klik untuk ganti foto</div>
                        <input type="file" id="editImage" accept="image/*" style="display: none;" onchange="handleEditFileSelect(event)">
                        <img id="editImagePreview" class="file-preview hidden">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Barcode</label>
                    <input type="text" class="form-input" id="editBarcode" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Nama Produk</label>
                    <input type="text" class="form-input" id="editProductName" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Simpan Perubahan
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration - GANTI DENGAN KONFIGURASI ANDA
        const firebaseConfig = {
  apiKey: "AIzaSyDB8ljheAGKQIFqslO6RohvfWnu6jF6iIQ",
  authDomain: "database-produk-40db0.firebaseapp.com",
  projectId: "database-produk-40db0",
  storageBucket: "database-produk-40db0.firebasestorage.app",
  messagingSenderId: "801084244428",
  appId: "1:801084244428:web:f1a6d2e4f53101f5da1d69"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let products = [];
        let isAdmin = false;
        let html5QrCode = null;
        let scannedBarcode = null;

        // Authentication
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, username, password);
                showToast('Login berhasil!', 'success');
            } catch (error) {
                showToast('Login gagal: ' + error.message, 'error');
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                isAdmin = true;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                document.getElementById('userBadge').textContent = 'Admin';
                document.getElementById('logoutBtn').style.display = 'block';
                loadProducts();
            } else {
                isAdmin = false;
            }
        });

        function logout() {
            signOut(auth);
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            showToast('Logout berhasil', 'success');
        }

        function showUserMode() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userBadge').textContent = 'User';
            document.getElementById('logoutBtn').style.display = 'none';
            loadProducts();
        }

        // Navigation
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (section === 'dashboard') {
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            } else if (section === 'input') {
                if (!isAdmin) {
                    showToast('Hanya admin yang bisa input produk', 'error');
                    return;
                }
                document.getElementById('inputSection').classList.remove('hidden');
                document.querySelectorAll('.nav-item')[1].classList.add('active');
            } else if (section === 'manage') {
                if (!isAdmin) {
                    showToast('Hanya admin yang bisa kelola produk', 'error');
                    return;
                }
                document.getElementById('manageSection').classList.remove('hidden');
                document.querySelectorAll('.nav-item')[2].classList.add('active');
                renderManageTable();
            }
        }

        // Firebase Operations
        async function loadProducts() {
            try {
                const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                updateDashboard();
                renderProductGrid();
            } catch (error) {
                showToast('Gagal memuat data: ' + error.message, 'error');
            }
        }

        function updateDashboard() {
            document.getElementById('totalProducts').textContent = products.length;
            
            const today = new Date().toDateString();
            const todayCount = products.filter(p => {
                const createdDate = p.createdAt?.toDate ? p.createdAt.toDate() : new Date(p.createdAt);
                return createdDate.toDateString() === today;
            }).length;
            document.getElementById('todayProducts').textContent = todayCount;
        }

        function renderProductGrid(filteredProducts = products) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">Tidak ada produk ditemukan</div>';
                return;
            }

            filteredProducts.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${product.image || 'https://via.placeholder.com/250x200?text=No+Image'}" class="product-image" alt="${product.name}">
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-barcode">${product.barcode}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function searchProducts() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchTerm) || 
                p.barcode.toLowerCase().includes(searchTerm)
            );
            renderProductGrid(filtered);
        }

        // File Upload
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                    document.getElementById('fileUploadText').textContent = file.name;
                    document.getElementById('fileUpload').classList.add('has-file');
                };
                reader.readAsDataURL(file);
            }
        }

        // Product Form
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const barcode = document.getElementById('barcode').value;
            const name = document.getElementById('productName').value;
            const imageFile = document.getElementById('productImage').files[0];

            let imageData = null;
            if (imageFile) {
                imageData = await fileToBase64(imageFile);
            }

            try {
                await addDoc(collection(db, "products"), {
                    barcode,
                    name,
                    image: imageData,
                    createdAt: new Date()
                });
                showToast('Produk berhasil ditambahkan!', 'success');
                document.getElementById('productForm').reset();
                document.getElementById('imagePreview').classList.add('hidden');
                document.getElementById('fileUploadText').textContent = 'Klik untuk upload foto';
                document.getElementById('fileUpload').classList.remove('has-file');
                loadProducts();
            } catch (error) {
                showToast('Gagal menambahkan produk: ' + error.message, 'error');
            }
        });

        // Manage Table
        function renderManageTable() {
            const searchTerm = document.getElementById('manageSearch').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchTerm) || 
                p.barcode.toLowerCase().includes(searchTerm)
            );

            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = '';

            filtered.forEach(product => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${product.image || 'https://via.placeholder.com/60?text=No+Image'}" class="table-image"></td>
                    <td>${product.name}</td>
                    <td style="font-family: 'Courier New', monospace;">${product.barcode}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-secondary btn-icon" onclick="openEditModal('${product.id}')">✏️</button>
                            <button class="btn btn-danger btn-icon" onclick="deleteProduct('${product.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Edit Product
        function openEditModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('editId').value = productId;
            document.getElementById('editBarcode').value = product.barcode;
            document.getElementById('editProductName').value = product.name;
            
            if (product.image) {
                document.getElementById('editImagePreview').src = product.image;
                document.getElementById('editImagePreview').classList.remove('hidden');
                document.getElementById('editFileUploadText').textContent = 'Foto sudah ada';
                document.getElementById('editFileUpload').classList.add('has-file');
            }

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.getElementById('editForm').reset();
            document.getElementById('editImagePreview').classList.add('hidden');
            document.getElementById('editFileUploadText').textContent = 'Klik untuk ganti foto';
            document.getElementById('editFileUpload').classList.remove('has-file');
        }

        function handleEditFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('editImagePreview').src = e.target.result;
                    document.getElementById('editImagePreview').classList.remove('hidden');
                    document.getElementById('editFileUploadText').textContent = file.name;
                    document.getElementById('editFileUpload').classList.add('has-file');
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editId').value;
            const barcode = document.getElementById('editBarcode').value;
            const name = document.getElementById('editProductName').value;
            const imageFile = document.getElementById('editImage').files[0];

            let updateData = { barcode, name };

            if (imageFile) {
                updateData.image = await fileToBase64(imageFile);
            }

            try {
                await updateDoc(doc(db, "products", id), updateData);
                showToast('Produk berhasil diupdate!', 'success');
                closeEditModal();
                loadProducts();
            } catch (error) {
                showToast('Gagal mengupdate produk: ' + error.message, 'error');
            }
        });

        async function deleteProduct(productId) {
            if (!confirm('Yakin ingin menghapus produk ini?')) return;

            try {
                await deleteDoc(doc(db, "products", productId));
                showToast('Produk berhasil dihapus!', 'success');
                loadProducts();
            } catch (error) {
                showToast('Gagal menghapus produk: ' + error.message, 'error');
            }
        }

        // Barcode Scanner
        function openScanner() {
            document.getElementById('scannerModal').classList.add('active');
            document.getElementById('scanResult').classList.add('hidden');
            document.getElementById('useScanBtn').disabled = true;
            scannedBarcode = null;

            html5QrCode = new Html5Qrcode("reader");
            
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 150 },
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.CODE_93,
                    Html5QrcodeSupportedFormats.ITF,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                showToast('Gagal mengakses kamera: ' + err, 'error');
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            scannedBarcode = decodedText;
            document.getElementById('scanResultValue').textContent = decodedText;
            document.getElementById('scanResult').classList.remove('hidden');
            document.getElementById('useScanBtn').disabled = false;
            
            // Beep sound
            const audio = new AudioContext();
            const oscillator = audio.createOscillator();
            const gainNode = audio.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audio.destination);
            oscillator.frequency.value = 800;
            gainNode.gain.value = 0.3;
            oscillator.start();
            setTimeout(() => oscillator.stop(), 200);

            html5QrCode.stop();
        }

        function onScanFailure(error) {
            // Ignore scan failures
        }

        function useScanResult() {
            if (scannedBarcode) {
                document.getElementById('barcode').value = scannedBarcode;
                closeScanner();
                showToast('Barcode berhasil discan!', 'success');
            }
        }

        function closeScanner() {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => console.log(err));
            }
            document.getElementById('scannerModal').classList.remove('active');
        }

        // Utilities
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Make functions global
        window.showSection = showSection;
        window.showUserMode = showUserMode;
        window.logout = logout;
        window.searchProducts = searchProducts;
        window.renderManageTable = renderManageTable;
        window.openEditModal = openEditModal;
        window.closeEditModal = closeEditModal;
        window.deleteProduct = deleteProduct;
        window.openScanner = openScanner;
        window.closeScanner = closeScanner;
        window.useScanResult = useScanResult;
        window.handleFileSelect = handleFileSelect;
        window.handleEditFileSelect = handleEditFileSelect;
    </script>
</body>
</html>
